# Despliegue único de Integra-ESAVI: Postgres + Keycloak + api + app + dashboard.
# Se ejecuta DESDE esta carpeta (workspace/), fuera de cada proyecto individual.
#
#   docker compose up -d --build
#
# URLs una vez arriba:
#   APP (React):       http://localhost:5173
#   API (NestJS):       http://localhost:8081  (health: /health)
#   Keycloak:           http://localhost:8080  (admin / admin_password)
#   Dashboard (Shiny):  http://localhost:3838
#   Postgres:           localhost:5433         (dhis / dhis, BD dhi_esavi)
#
# oauth2-proxy y nginx (TLS) quedan bajo el profile "proxy" porque HOY no son
# funcionales out-of-the-box: falta crear el client "dash-integra-esavi-client"
# en Keycloak (no está en scripts/keycloak-realm.json), generar un
# client-secret y cookie-secret reales, y crear dash-integra-esavi/nginx/
# (nginx.conf + certs/). Ver DESPLIEGUE-PRODUCCION.md. Mientras tanto, el
# dashboard se expone directo en :3838.
#
#   docker compose --profile proxy up -d --build   # una vez configurado lo anterior

name: integra-esavi

services:
  postgres:
    image: postgres:15
    container_name: postgres_esavi
    environment:
      POSTGRES_USER: dhis
      POSTGRES_PASSWORD: dhis
      POSTGRES_DB: dhi_esavi
      TZ: America/Guayaquil
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhis -d dhi_esavi"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-init:
    image: postgres:15
    container_name: db_init_esavi
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: dhis
    volumes:
      - ./api-integra-esavi/scripts/init-db.sh:/init-db.sh
    entrypoint: ["/bin/bash", "/init-db.sh"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak_esavi
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password123
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./api-integra-esavi/scripts/keycloak-realm.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db-init:
        condition: service_completed_successfully

  api:
    build:
      context: ./api-integra-esavi
      dockerfile: Dockerfile
    container_name: api_esavi
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # La imagen trae un .env horneado (localhost); estas variables lo pisan
      # en runtime para apuntar a los servicios dentro de la red de docker.
      # El Dockerfile hornea USER/PASS/NAME/SCHEMA_DATABASE vacíos a propósito
      # (ver comentario "inyectar variables con env_file..."), hay que darlos aquí.
      HOST_DATABASE: postgres
      PORT_DATABASE: "5432"
      USER_DATABASE: dhis
      PASS_DATABASE: dhis
      NAME_DATABASE: dhi_esavi
      SCHEMA_DATABASE: DHI_ESAVI
      WHD_DB_HOST: postgres
      WHD_DB_PORT: "5432"
      MDD_DB_HOST: postgres
      MDD_DB_PORT: "5432"
      TZ: America/Guayaquil
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Datamart DuckDB compartido con el dashboard.
      - ./api-integra-esavi/datos:/app/datos
      # CSVs de seed (catálogo padre, DPA, entidades): excluidos de la imagen
      # por .dockerignore, se montan para que el seed de arranque los encuentre.
      - ./api-integra-esavi/upload_files:/app/upload_files
    depends_on:
      db-init:
        condition: service_completed_successfully

  app-web:
    build:
      context: ./app-integra-esavi
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-integra-esavi}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-integra-esavi-client}
        VITE_INTEGRA_ESAVI_API_URL: ${VITE_INTEGRA_ESAVI_API_URL:-http://localhost:8081}
        VITE_API_KEY: ${VITE_API_KEY:-6PxFc1GiLz8i2EWuJkj9qrJOrqjTNW4h}
        VITE_ESAVI_GRAVE: ${VITE_ESAVI_GRAVE:-true}
        VITE_ESAVI_DASHBOARD_TOKEN: ${VITE_ESAVI_DASHBOARD_TOKEN:-}
    container_name: app_esavi
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy

  dashboard:
    build:
      context: ./dash-integra-esavi
      dockerfile: Dockerfile
    container_name: dashboard_esavi
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dhi_esavi
      DB_USER: dhis
      DB_PASS: dhis
      LOG_ACCESS_ATTEMPTS: "true"
      LOG_FILE_PATH: /app/logs/access.log
      DUCKDB_PATH: /app/datos/esavi.duckdb
      INTEGRA_APP_URL: http://localhost:5173
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-integra-esavi}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-integra-esavi-client}
    ports:
      - "3838:80"
    volumes:
      - ./dash-integra-esavi/datos:/app/datos
      - ./dash-integra-esavi/fuente_de_datos:/app/fuente_de_datos
      - ./dash-integra-esavi/logs:/app/logs
      # esavi.duckdb lo genera el api; se monta de solo lectura para el dashboard.
      - ./api-integra-esavi/datos/esavi.duckdb:/app/datos/esavi.duckdb:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      db-init:
        condition: service_completed_successfully

  # ── Opcionales: solo con `--profile proxy` (ver notas arriba) ────────────────
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: esavi_oauth2_proxy
    restart: unless-stopped
    profiles: ["proxy"]
    command:
      - --provider=keycloak-oidc
      - --client-id=dash-integra-esavi-client
      - --client-secret=${OAUTH2_CLIENT_SECRET}
      - --oidc-issuer-url=http://keycloak:8080/realms/integra-esavi
      - --redirect-url=${OAUTH2_REDIRECT_URL:-http://localhost/oauth2/callback}
      - --upstream=http://dashboard:80
      - --http-address=0.0.0.0:4180
      - --cookie-secret=${OAUTH2_COOKIE_SECRET}
      - --cookie-secure=false
      - --cookie-name=_esavi_session
      - --email-domain=*
      - --allowed-role=integra-esavi:analitic
      - --allowed-role=integra-esavi:arcsa
      - --allowed-role=integra-esavi:dhis
      - --allowed-role=integra-esavi:paho
      - --set-xauthrequest=true
      - --pass-user-headers=true
    depends_on:
      dashboard:
        condition: service_healthy

  dash-nginx:
    image: nginx:1.27-alpine
    container_name: esavi_nginx
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dash-integra-esavi/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dash-integra-esavi/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - oauth2-proxy

volumes:
  postgres_data:
