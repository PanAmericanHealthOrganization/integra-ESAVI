services:

  # ── Pre-chequeo: el datamart DuckDB debe existir ─────────────────────────────
  # El despliegue del dashboard es MANUAL y SEPARADO del de la API. La API genera
  # ../api-integra-esavi/datos/esavi.duckdb (cron / POST /v1/datamart/regenerar).
  # Este servicio verifica que el archivo exista ANTES de arrancar el dashboard;
  # si no está, sale con código != 0 y el despliegue del dashboard FALLA.
  # Monta el directorio (no el archivo) para no caer en el bug de podman que crea
  # un directorio vacío cuando el archivo de origen no existe.
  duckdb-check:
    image: busybox:1.36
    container_name: esavi-duckdb-check
    volumes:
      - ../api-integra-esavi/datos:/check:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        if [ -f /check/esavi.duckdb ] && [ -s /check/esavi.duckdb ]; then
          echo "OK: esavi.duckdb encontrado; el dashboard puede desplegarse.";
        else
          echo "ERROR: falta ../api-integra-esavi/datos/esavi.duckdb." >&2;
          echo "       Genera el datamart con la API (POST /v1/datamart/regenerar" >&2;
          echo "       o el arranque de la API) antes de desplegar el dashboard." >&2;
          exit 1;
        fi
    networks:
      - esavi-internal

  # ── Imagen base (dependencias de sistema + paquetes R) ───────────────────────
  # No se levanta: existe solo para construir la base, que es la parte lenta del
  # build (renv::restore) y se reutiliza en cada build de la app.
  #   podman-compose --profile base build dash-base
  dash-base:
    profiles: ["base"]
    image: ${DASH_BASE_IMAGE:-localhost/integra-esavi/dash-base:4.4.1}
    build:
      context: .
      dockerfile: Dockerfile.deps

  # ── Dashboard Shiny ──────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${DASH_BASE_IMAGE:-localhost/integra-esavi/dash-base:4.4.1}
    image: dash-integra-esavi:latest
    container_name: esavi-dashboard
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-DHI_ESAVI}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      LOG_ACCESS_ATTEMPTS:       ${LOG_ACCESS_ATTEMPTS:-true}
      LOG_FILE_PATH:             /app/logs/access.log
      # Datamart DuckDB generado por api-integra-esavi (reemplaza los RDS).
      DUCKDB_PATH:               ${DUCKDB_PATH:-/app/datos/esavi.duckdb}
      INTEGRA_APP_URL:           ${INTEGRA_APP_URL:-http://localhost:8080}
      VITE_KEYCLOAK_URL:         ${VITE_KEYCLOAK_URL:-}
      VITE_KEYCLOAK_REALM:       ${VITE_KEYCLOAK_REALM:-}
      VITE_KEYCLOAK_CLIENT_ID:   ${VITE_KEYCLOAK_CLIENT_ID:-}
      KC_REQUIRED_ROLE:          ${KC_REQUIRED_ROLE:-analitic}
    ports:
      - "3838:80"
    volumes:
      - ./datos:/app/datos
      - ./fuente_de_datos:/app/fuente_de_datos
      - ./logs:/app/logs
      # datos/esavi.duckdb es un symlink relativo a ../../api-integra-esavi/datos/esavi.duckdb;
      # dentro del contenedor ese destino no existe salvo que se monte también.
      - ../api-integra-esavi/datos/esavi.duckdb:/app/datos/esavi.duckdb:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - esavi-internal
    depends_on:
      duckdb-check:
        condition: service_completed_successfully

  # ── Actualización de datos (RETIRADA) ───────────────────────────────────────
  # El pipeline R (preparar_datos.R + procesamiento_datos.R) fue reemplazado por
  # el módulo `datamart` de api-integra-esavi, que genera datos/esavi.duckdb
  # (cron diario + POST /v1/datamart/regenerar). El dashboard solo lo lee.

# ── Redes ──────────────────────────────────────────────────────────────────────
networks:
  esavi-internal:
    driver: bridge
