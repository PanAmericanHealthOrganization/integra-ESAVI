services:

  # ── Dashboard Shiny ──────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: dash-integra-esavi:latest
    container_name: esavi-dashboard
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-dhi_esavi}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      LOG_ACCESS_ATTEMPTS: ${LOG_ACCESS_ATTEMPTS:-true}
      LOG_FILE_PATH:       /app/logs/access.log
    volumes:
      - ./datos:/app/datos
      - ./fuente_de_datos:/app/fuente_de_datos
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - esavi-internal

  # ── oauth2-proxy: autenticación Keycloak + control de rol ───────────────────
  # Intercepta toda petición antes de llegar al dashboard.
  # Sin sesión Keycloak válida → redirige al login.
  # Sin rol "analitic" → 403.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: esavi-oauth2-proxy
    restart: unless-stopped
    ports:
      - "8090:4180"
    command:
      - --provider=keycloak-oidc
      - --client-id=${VITE_KEYCLOAK_CLIENT_ID}
      - --client-secret=${KC_CLIENT_SECRET}
      - --oidc-issuer-url=${VITE_KEYCLOAK_URL}/realms/${VITE_KEYCLOAK_REALM}
      - --redirect-url=${APP_URL}/oauth2/callback
      - --upstream=http://dashboard:80
      - --http-address=0.0.0.0:4180
      - --cookie-secret=${OAUTH2_COOKIE_SECRET}
      - --cookie-secure=false
      - --cookie-name=_esavi_session
      - --email-domain=*
      # Solo usuarios con rol de realm "analitic" tienen acceso
      - --allowed-role=analitic
      # Pasar identidad del usuario al dashboard como headers
      - --set-xauthrequest=true
      - --pass-user-headers=true
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - esavi-internal

  # ── Actualización periódica de datos (perfil opcional) ──────────────────────
  # Uso: docker compose --profile refresh run --rm data-refresh
  data-refresh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esavi-data-refresh
    profiles: ["refresh"]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-dhi_esavi}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - ./datos:/app/datos
      - ./fuente_de_datos:/app/fuente_de_datos
      - ./logs:/app/logs
    command: >
      Rscript -e "
        source('preparar_datos.R');
        source('scripts/procesamiento_datos.R');
        cat('Actualización de datos completada.\n')
      "
    networks:
      - esavi-internal

# ── Redes ──────────────────────────────────────────────────────────────────────
networks:
  esavi-internal:
    # No es internal: true porque oauth2-proxy necesita llegar a Keycloak en internet.
    # El dashboard queda protegido porque no tiene ports: expuestos.
    driver: bridge
