# ── Docker Compose para DESARROLLO (solo localhost) ─────────────────────────────
# Levanta únicamente la infraestructura: postgres + keycloak (con db-init para
# crear esquemas y la BD/usuario de keycloak). La API y la app-web se corren
# aparte (p. ej. localmente con pnpm) apuntando a este postgres/keycloak.
#
# Uso:
#   docker compose -f docker-compose.dev.yaml up -d
#   docker compose -f docker-compose.dev.yaml logs -f keycloak
#
# Todos los puertos se publican solo en 127.0.0.1.

name: integra-esavi-dev

services:
  postgres:
    image: postgres:15
    container_name: postgres_esavi_dev
    environment:
      POSTGRES_USER: dhis
      POSTGRES_PASSWORD: dhis
      POSTGRES_DB: DHI_ESAVI
      TZ: America/Guayaquil
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhis -d DHI_ESAVI"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Crea los esquemas de la BD y el usuario/BD de keycloak (requerido por keycloak)
  db-init:
    image: postgres:15
    container_name: db_init_esavi_dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: dhis
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak_server_dev
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password123
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./scripts/keycloak-realm.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  postgres_data_dev:
