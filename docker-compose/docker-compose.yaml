services:
  postgres:
    image: postgres:15
    container_name: postgres_esavi
    environment:
      POSTGRES_USER: dhis
      POSTGRES_PASSWORD: dhis
      POSTGRES_DB: DHI_ESAVI
      TZ: America/Guayaquil
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhis -d DHI_ESAVI"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db-init:
    image: postgres:15
    container_name: db_init_esavi
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: dhis
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak_server
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password123
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # URL pública fija. Sin esto, start-dev deriva el frontend URL del Host de
      # cada petición: el navegador (localhost:8080) y oauth2-proxy (keycloak:8080)
      # obtendrían un claim `iss` distinto y la validación del token fallaría.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./scripts/keycloak-realm.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db-init:
        condition: service_completed_successfully

  api:
    build:
      context: ../proyecto-02-integra-esavi/workspace/api-integra-esavi
      dockerfile: Dockerfile
    container_name: api_integra_esavi
    restart: unless-stopped
    environment:
      HOST_DATABASE: postgres
      PORT_DATABASE: "5432"
      NAME_DATABASE: DHI_ESAVI
      USER_DATABASE: dhis
      PASS_DATABASE: dhis
      SCHEMA_DATABASE: DHI_ESAVI
      MDD_DB_HOST: postgres
      MDD_DB_PORT: "5432"
      MDD_DB_NAME: DHI_ESAVI
      MDD_DB_USER: dhis
      MDD_DB_PASS: dhis
      WHD_DB_HOST: postgres
      WHD_DB_PORT: "5432"
      WHD_DB_NAME: DHI_ESAVI
      WHD_DB_USER: dhis
      WHD_DB_PASS: dhis
      TZ: America/Guayaquil
      # ── Validación de tokens Keycloak (KeycloakAuthGuard) ─────────────────────
      # Solo lo usa /v1/integrator/reports/*; el resto de controllers no lleva guard.
      # KEYCLOAK_URL debe coincidir LITERALMENTE con el claim `iss` de los tokens,
      # que Keycloak firma con su KC_HOSTNAME (localhost:8080, el que ve el navegador).
      # KEYCLOAK_INTERNAL_URL es de dónde este contenedor descarga el JWKS: aquí
      # `localhost` sería el propio API, así que se usa el nombre de servicio.
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: integra-esavi
      # Datamart DuckDB: el API lo genera en el volumen compartido con el dashboard.
      DATAMART_DUCKDB_PATH: /app/datamart-out/esavi.duckdb
      DATAMART_TMP_DIR: /app/datamart-out
      DATAMART_CRON: "0 2 * * *"
    ports:
      - "3000:3000"
    volumes:
      # Directorio compartido con el dashboard: aquí se escribe esavi.duckdb.
      #
      # dash-integra-esavi/datos es la ubicación canónica del datamart. El API lo produce
      # y el dashboard solo lo lee, pero el archivo vive del lado del consumidor: así el
      # dashboard lo encuentra en su ruta por defecto (`datos/esavi.duckdb` relativo a su
      # carpeta) sin enlaces ni montajes extra, dentro y fuera del contenedor.
      - ../proyecto-02-integra-esavi/workspace/dash-integra-esavi/datos:/app/datamart-out
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db-init:
        condition: service_completed_successfully

  app-web:
    build:
      context: ../proyecto-02-integra-esavi/workspace/app-integra-esavi
      dockerfile: Dockerfile
    container_name: app_integra_esavi
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy

  # ── Imagen base del dashboard (dependencias R) ────────────────────────────────
  # No se levanta nunca: existe solo para poder construir la base con compose.
  # Es la parte lenta del build y se reutiliza entre builds de la app.
  #   ./scripts/build-dash-base.sh                        (recomendado)
  #   podman-compose --profile base build dash-base       (equivalente)
  dash-base:
    profiles: ["base"]
    image: ${DASH_BASE_IMAGE:-localhost/integra-esavi/dash-base:4.4.1}
    build:
      context: ../proyecto-02-integra-esavi/workspace/dash-integra-esavi
      dockerfile: Dockerfile.deps

  # ── Pre-chequeo: el datamart DuckDB debe existir ──────────────────────────────
  # El dashboard aborta con un stack trace de R si el archivo no está. Este servicio
  # da el error legible antes, y sobre todo ESPERA: el API genera el datamart al
  # arrancar cuando falta, pero lo hace en segundo plano y sin bloquear su arranque
  # (datamart.service.ts, onApplicationBootstrap), así que estar `healthy` no implica
  # que el archivo ya exista en un despliegue frío.
  #
  # Monta el directorio y no el archivo por el bug de podman que crea un directorio
  # vacío cuando el origen no existe —justo el caso del primer despliegue—.
  duckdb-check:
    image: busybox:1.36
    container_name: esavi-duckdb-check
    volumes:
      - ../proyecto-02-integra-esavi/workspace/dash-integra-esavi/datos:/check:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        i=0;
        while [ $$i -lt 120 ]; do
          if [ -s /check/esavi.duckdb ]; then
            echo "OK: esavi.duckdb encontrado; el dashboard puede arrancar.";
            exit 0;
          fi;
          if [ $$i -eq 0 ]; then
            echo "Esperando a que el API genere el datamart (hasta 10 min)...";
          fi;
          i=$$((i + 1));
          sleep 5;
        done;
        echo "ERROR: el datamart no apareció tras 10 min de espera." >&2;
        echo "       Revisa el log del API (regeneración de arranque) o generalo" >&2;
        echo "       a mano con POST /v1/datamart/regenerar (rol admin)." >&2;
        exit 1
    # Sin depends_on del API a propósito: lo que condiciona al dashboard es que el
    # ARCHIVO esté, no que el API esté sano. Atarlo a `api: service_healthy` impediría
    # levantar el dashboard con un datamart ya generado cuando el API está caído por
    # cualquier motivo ajeno, y tampoco garantizaría nada —la generación de arranque
    # es en segundo plano—. La espera de arriba cubre el caso del despliegue frío.

  # ── Dashboard Shiny ────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ../proyecto-02-integra-esavi/workspace/dash-integra-esavi
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${DASH_BASE_IMAGE:-localhost/integra-esavi/dash-base:4.4.1}
    container_name: esavi-dashboard
    restart: unless-stopped
    # ⚠ ACCESO DIRECTO SIN AUTENTICACIÓN — SOLO DESARROLLO LOCAL.
    # Es el destino de VITE_DASH_APP en app-integra-esavi/.env. Este puerto
    # entra al Shiny saltándose nginx y oauth2-proxy, así que NO se aplica el
    # login de Keycloak ni los --allowed-role. En producción hay que quitar
    # este mapeo y acceder solo por https://localhost/ (nginx → oauth2-proxy).
    ports:
      - "3838:80"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: DHI_ESAVI
      DB_USER: dhis
      DB_PASS: dhis
      LOG_ACCESS_ATTEMPTS: "true"
      LOG_FILE_PATH: /app/logs/access.log
      # Datamart DuckDB generado por el API (reemplaza los RDS de datos). Es el mismo
      # directorio que el API monta como /app/datamart-out, aquí en su ruta natural.
      DUCKDB_PATH: /app/datos/esavi.duckdb
      # ── Autenticación Keycloak en el propio dashboard ─────────────────────────
      # Activa www/js/keycloak-auth.js (global.R: kc_enabled exige las tres). Es
      # lo que protege el acceso directo por :3838, donde no hay oauth2-proxy.
      # Mismo realm y MISMO cliente que app-integra-esavi: así la sesión de
      # Keycloak se comparte y no se vuelve a pedir login al saltar entre ambas.
      # Estas URLs las abre el NAVEGADOR, por eso localhost y no keycloak.
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: integra-esavi
      VITE_KEYCLOAK_CLIENT_ID: integra-esavi-client
      # Roles de realm admitidos (basta con tener uno).
      KC_REQUIRED_ROLE: "analitic,arcsa,dhis,paho"
      # Destino del enlace "Ir a Integra App" del sidebar. El valor por defecto
      # en global.R es http://localhost:8080, que es Keycloak, no la app.
      INTEGRA_APP_URL: http://localhost:5173
    volumes:
      - ../proyecto-02-integra-esavi/workspace/dash-integra-esavi/datos:/app/datos
      - ../proyecto-02-integra-esavi/workspace/dash-integra-esavi/fuente_de_datos:/app/fuente_de_datos
      - ../proyecto-02-integra-esavi/workspace/dash-integra-esavi/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - default
      - esavi-internal
    depends_on:
      db-init:
        condition: service_completed_successfully
      # Arrancar sin datamart es un fallo garantizado del dashboard, no una carrera
      # que se resuelva sola: load_data() lo lee una sola vez al iniciar.
      duckdb-check:
        condition: service_completed_successfully

  # ── oauth2-proxy: autenticación Keycloak + control de roles ───────────────────
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: esavi-oauth2-proxy
    restart: unless-stopped
    command:
      - --provider=keycloak-oidc
      - --client-id=dash-integra-esavi-client
      # Coincide con el secret del cliente en scripts/keycloak-realm.json.
      # Para producción hay que cambiarlo EN AMBOS SITIOS.
      - --client-secret=CAMBIAR_POR_SECRET_REAL
      # Keycloak local (el que levanta este compose), no el remoto: el realm
      # importado ya trae este cliente con la redirect URI de localhost y los roles.
      #
      # El navegador y este contenedor ven Keycloak en hostnames distintos, así que
      # se desactiva el discovery automático y se declara cada endpoint por su lado:
      #   - login-url  -> lo abre el NAVEGADOR      => localhost:8080
      #   - redeem/jwks-> los llama ESTE CONTENEDOR => keycloak:8080
      # issuer-url debe coincidir literalmente con el claim `iss` (ver KC_HOSTNAME).
      - --skip-oidc-discovery=true
      - --oidc-issuer-url=http://localhost:8080/realms/integra-esavi
      - --login-url=http://localhost:8080/realms/integra-esavi/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/integra-esavi/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/integra-esavi/protocol/openid-connect/certs
      - --redirect-url=https://localhost/oauth2/callback
      - --upstream=http://dashboard:80
      - --http-address=0.0.0.0:4180
      # Base64 URL-safe de 32 bytes: oauth2-proxy decodifica con el alfabeto
      # URL-safe, así que '+' y '/' hacen fallar el decode y toma la cadena literal.
      - --cookie-secret=RtHzFPFkutUi6eU0f8N1UDQ3Xb3aK8Y9Q-GBrd-uw34=
      - --cookie-secure=true
      - --cookie-name=_esavi_session
      - --email-domain=*
      # Roles de REALM (así están definidos en scripts/keycloak-realm.json), que
      # oauth2-proxy expone sin prefijo. El prefijo 'cliente:' es solo para roles
      # de cliente (resource_access), que este realm no usa.
      - --allowed-role=analitic
      - --allowed-role=arcsa
      - --allowed-role=dhis
      - --allowed-role=paho
      - --set-xauthrequest=true
      - --pass-user-headers=true
      # Permite que /oauth2/sign_out?rd=... redirija al end-session de Keycloak.
      # Sin este dominio en la lista, oauth2-proxy ignora el rd por seguridad y
      # el logout cerraría su cookie pero dejaría viva la sesión SSO.
      - --whitelist-domain=localhost:8080
    networks:
      - esavi-internal
      - esavi-public
      # keycloak vive en la red default; sin esto no se alcanza redeem/jwks.
      - default
    depends_on:
      dashboard:
        condition: service_healthy

  # ── Nginx: TLS + proxy hacia oauth2-proxy ────────────────────────────────────
  dash-nginx:
    image: nginx:1.27-alpine
    container_name: esavi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../proyecto-02-integra-esavi/workspace/dash-integra-esavi/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../proyecto-02-integra-esavi/workspace/dash-integra-esavi/nginx/certs:/etc/nginx/certs:ro
    networks:
      - esavi-public
    depends_on:
      - oauth2-proxy

volumes:
  postgres_data:

networks:
  default:
  esavi-internal:
    internal: true
  esavi-public:
    driver: bridge
